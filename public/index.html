<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase Keep-Alive Service</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --fg: #f3f4f6;
      --accent: #3b82f6;
      --accent-grad: linear-gradient(135deg, #3b82f6 0%, #10b981 100%);
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg);
      color: var(--fg);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Ambient background glow */
    body::before {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(16, 185, 129, 0.05) 50%, transparent 100%);
      top: 10%;
      left: 10%;
      z-index: 1;
    }

    body::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, rgba(59, 130, 246, 0.05) 50%, transparent 100%);
      bottom: 10%;
      right: 10%;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 600px;
      padding: 40px;
      text-align: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    h1 {
      margin: 0 0 16px 0;
      font-size: 2.5rem;
      font-weight: 800;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 1.1rem;
      color: #9ca3af;
      line-height: 1.6;
      margin: 0 0 24px 0;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background-color: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: #10b981;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 30px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .footer {
      font-size: 0.85rem;
      color: #6b7280;
      border-top: 1px solid var(--card-border);
      padding-top: 20px;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.9);
        opacity: 1;
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }
      70% {
        transform: scale(1);
        opacity: 0.5;
        box-shadow: 0 0 0 8px rgba(16, 185, 129, 0);
      }
      100% {
        transform: scale(0.9);
        opacity: 1;
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="status-badge">
      <div class="status-dot"></div>
      Keep-Alive Activo
    </div>
    <h1>Supabase Keep-Alive</h1>
    <p>El servicio de conexión permanente para tus bases de datos gratuitas de Supabase está activo y respondiendo de forma correcta.</p>
    <div class="footer">
      Ejecutando servidor de fondo mediante Vercel Serverless & Crons
    </div>
  </div>
</body>
</html>
